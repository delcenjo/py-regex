version: '2.0'
metadata:
  title: Format Cross Pollination Bbcode To Markdown
  description: Regex avanzado para Format Cross Pollination Bbcode To Markdown en
    entorno de home. Optimizado para precisión y análisis de grupos léxicos O(N).
  tags:
  - home
  - delcenjo
  - ai_generated
  - strict
  priority: 52
wizard:
  steps: []
logic:
  base_pattern: (?:.*?)(?P<email>(?P<local>(?!.*\.{2})[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+)@(?P<domain>(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}))(?:.*?)
corpus:
  matches:
  - value: Match_example_for_home
    label: Valid Case
  non_matches:
  - value: Inval1d~!
    reason: Falla validaciones métricas strictas
