version: '2.0'
metadata:
  title: Blockquote Nesting Levels Email Markdown Obfuscati
  description: Regex avanzado para Blockquote Nesting Levels Email Markdown Obfuscati
    en entorno de home. Optimizado para precisión y análisis de grupos léxicos O(N).
  tags:
  - home
  - delcenjo
  - ai_generated
  - strict
  priority: 81
wizard:
  steps: []
logic:
  base_pattern: (?:(?P<email>(?P<local>(?!.*\.{2})[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+)@(?P<domain>(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}))|(?=.*(?:%[0-9A-Fa-f]{2}|\\u[0-9A-Fa-f]{4}|&#[xX]?[0-9A-Fa-f]+;)).*?)
corpus:
  matches:
  - value: Match_example_for_home
    label: Valid Case
  non_matches:
  - value: Inval1d~!
    reason: Falla validaciones métricas strictas
