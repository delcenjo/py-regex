version: '2.0'
metadata:
  title: Variable Substitution Placeholders Tags Format Che
  description: Regex avanzado para Variable Substitution Placeholders Tags Format
    Che en entorno de home. Optimizado para precisión y análisis de grupos léxicos
    O(N).
  tags:
  - home
  - delcenjo
  - ai_generated
  - strict
  priority: 78
wizard:
  steps: []
logic:
  base_pattern: (?:.*?)(?P<generic_key>[A-Za-z0-9_-]+)\s*[:=]\s*(?P<generic_val>(?:\d+(?:\.\d+)?)|(?:[\"'].*?[\"']))(?:.*?)
corpus:
