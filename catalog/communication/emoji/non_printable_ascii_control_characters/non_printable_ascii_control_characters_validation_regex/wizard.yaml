version: '2.0'
metadata:
  title: 'Non Printable Ascii Control Characters Validation '
  description: Regex avanzado para Non Printable Ascii Control Characters Validation  en
    entorno de home. Optimizado para precisión y análisis de grupos léxicos O(N).
  tags:
  - home
  - delcenjo
  - ai_generated
  - strict
  priority: 25
wizard:
  steps: []
logic:
  base_pattern: (?:.*?)[\U00010000-\U0010ffff](?:.*?)
corpus:
  matches:
  - value: Match_example_for_home
    label: Valid Case
  non_matches:
  - value: Inval1d~!
    reason: Falla validaciones métricas strictas
