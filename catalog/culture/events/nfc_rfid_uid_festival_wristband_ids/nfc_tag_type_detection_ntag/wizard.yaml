version: '2.0'
metadata:
  title: Nfc Tag Type Detection Ntag
  description: Regex avanzado para Nfc Tag Type Detection Ntag en entorno de home.
    Optimizado para precisión y análisis de grupos léxicos O(N).
  tags:
  - home
  - delcenjo
  - ai_generated
  - strict
  priority: 83
wizard:
  steps: []
logic:
  base_pattern: (?:.*)(?P<generic_key>[A-Za-z0-9_-]+)\s*[:=]\s*(?P<generic_val>(?:\d+(?:\.\d+)?)|(?:[\"'].*?[\"']))(?:.*)
corpus:
  matches:
  - value: Match_example_for_home
    label: Valid Case
  non_matches:
  - value: Inval1d~!
    reason: Falla validaciones métricas strictas
